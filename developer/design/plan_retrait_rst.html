function refreshCard(id) {
  const card = document.getElementById(`task-${id}`);
  if (!card) return;
  const a = answerOf(id);
  const stale = !a.d && a.p;
  card.dataset.state = a.d || (stale ? "stale" : "");
  card.querySelector('[data-role="state"]').textContent = a.d ? DEC_LABEL[a.d] : (stale ? "À revoir" : "Sans décision");
  const note = card.querySelector('[data-role="stale"]');
  if (stale) {
    const task = TASK_BY_ID[id];
    const before = a.p.d ? DEC_LABEL[a.p.d] : "sans décision";
    const label = a.p.o ? oldOptionLabel(task, a.p.o) : "";
    note.textContent = "La tâche a changé depuis votre réponse (« " + before + " »" + (label ? ", variante : " + label : "") + "). Merci de la revoir.";
    note.hidden = false;
  } else {
    note.hidden = true;
  }
  card.querySelectorAll(`input[name="d-${id}"]`).forEach((input) => { input.checked = input.value === a.d; });
  card.querySelectorAll(`input[name="o-${id}"]`).forEach((input) => { input.checked = input.value === a.o; });
  card.querySelector("[data-clear]").hidden = !(a.d || a.o);
  const area = card.querySelector("textarea");
  if (document.activeElement !== area && area.value !== a.c) area.value = a.c;
  applyFilterToCard(card);
}

function visibleFor(state) {
  const s = state || "";
  if (filter === "all") return true;
  if (filter === "none") return s === "" || s === "stale";
  return filter === s;
}
function applyFilterToCard(card) {
  card.hidden = !visibleFor(card.dataset.state);
}
function oldOptionLabel(task, key) {
  const opt = (task.oldO || task.o || []).find((o) => o.k === key);
  return opt ? opt.l.replace(/<[^>]+>/g, "") : "";
}
function applyFilter() {
  document.querySelectorAll(".card").forEach((card) => {
    if (!card.dataset.state) card.dataset.state = "";
    card.hidden = !visibleFor(card.dataset.state);
  });
  document.querySelectorAll(".chip").forEach((chip) => chip.setAttribute("aria-pressed", String(chip.dataset.filter === filter)));
}

function counts(tasks) {
  const c = { ok: 0, talk: 0, ko: 0, none: 0, total: tasks.length };
  tasks.forEach((task) => { c[answerOf(task.id).d || "none"] += 1; });
  return c;
}

function updateCounts() {
  const all = counts(ALL_TASKS);
  const decided = all.ok + all.talk + all.ko;
  document.getElementById("bar-ok").style.width = `${(all.ok / all.total) * 100}%`;
  document.getElementById("bar-talk").style.width = `${(all.talk / all.total) * 100}%`;
  document.getElementById("bar-ko").style.width = `${(all.ko / all.total) * 100}%`;
  document.getElementById("progress-text").textContent =
    `${decided} sur ${all.total} décidées · ${all.ok} validées · ${all.talk} à discuter · ${all.ko} invalidées`;
  TABS.forEach((tab) => {
    const c = counts(tab.tasks);
    const badge = document.querySelector(`[data-count="${tab.id}"]`);
    badge.textContent = c.none === 0 ? "OK" : `${c.none}`;
    badge.dataset.done = String(c.none === 0);
    badge.title = c.none === 0 ? "Toutes les tâches ont une décision" : `${c.none} sans décision`;
  });
  if (activeTab === "synthese") renderSummary();
}

/* ------------------------------ summary ----------------------------- */
function optionLabel(task, key) {
  const opt = (task.o || []).find((o) => o.k === key);
  return opt ? opt.l.replace(/<[^>]+>/g, "") : "";
}
function days(tasks) {
  return tasks.reduce((sum, task) => sum + EFFORT[task.e], 0);
}
function fmtDays(n) { return (Math.round(n * 2) / 2).toString().replace(".", ","); }

function buildExport() {
  const lines = [];
  const date = new Date().toISOString().slice(0, 10);
  lines.push(`# Retrait de RST : décisions sur le plan, révision ${PLAN_VERSION} (${date})`, "");
  const all = counts(ALL_TASKS);
  lines.push(`${all.ok} validées, ${all.talk} à discuter, ${all.ko} invalidées, ${all.none} sans décision sur ${all.total}.`, "");
  TABS.forEach((tab) => {
    lines.push(`## ${tab.title}`, "");
    tab.tasks.forEach((task) => {
      const a = answerOf(task.id);
      const state = a.d ? DEC_LABEL[a.d] : (a.p ? "À revoir" : "Sans décision");
      let line = `- ${task.id} ${task.t.replace(/<[^>]+>/g, "")} : ${state}`;
      if (a.o) line += ` ; variante : ${optionLabel(task, a.o)}`;
      lines.push(line);
      if (a.c && a.c.trim()) a.c.trim().split("\n").forEach((row) => lines.push(`  > ${row}`));
    });
    lines.push("");
  });
  return lines.join("\n");
}

function renderSummary() {
  const rows = TABS.map((tab) => {
    const c = counts(tab.tasks);
    return `<tr><td>${tab.label}</td><td>${c.ok}</td><td>${c.talk}</td><td>${c.ko}</td><td>${c.none}</td><td>${c.total}</td></tr>`;
  }).join("");
  const all = counts(ALL_TASKS);
  const okTasks = ALL_TASKS.filter((task) => answerOf(task.id).d === "ok");
  const talkTasks = ALL_TASKS.filter((task) => answerOf(task.id).d === "talk");
  const noneTasks = ALL_TASKS.filter((task) => !answerOf(task.id).d);
  const staleCount = ALL_TASKS.filter((task) => !answerOf(task.id).d && answerOf(task.id).p).length;
  document.getElementById("summary-table").innerHTML = `
    <div class="table-scroll"><table class="sum">
      <thead><tr><th>Thème</th><th>Validées</th><th>À discuter</th><th>Invalidées</th><th>Sans décision</th><th>Total</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Tous les thèmes</td><td>${all.ok}</td><td>${all.talk}</td><td>${all.ko}</td><td>${all.none}</td><td>${all.total}</td></tr></tfoot>
    </table></div>
    <p class="note">Charge estimée : ${fmtDays(days(okTasks))} jours pour les tâches validées, ${fmtDays(days(talkTasks))} jours de plus si les tâches à discuter sont retenues, ${fmtDays(days(noneTasks))} jours sans décision (dont ${staleCount} tâche(s) à revoir). Ordres de grandeur pour une personne.</p>`;

  const chosen = ALL_TASKS.filter((task) => answerOf(task.id).o);
  document.getElementById("summary-options").innerHTML = chosen.length
    ? `<ul class="commentlist">${chosen.map((task) => `<li><span class="mono">${task.id}</span> ${optionLabel(task, answerOf(task.id).o)}</li>`).join("")}</ul>`
    : `<p class="note">Aucune variante choisie pour l'instant.</p>`;

  const withComment = ALL_TASKS.filter((task) => (answerOf(task.id).c || "").trim());
  const list = document.getElementById("summary-comments");
  list.innerHTML = "";
  if (!withComment.length) {
    const li = document.createElement("li");
    li.textContent = "Aucun commentaire pour l'instant.";
    list.appendChild(li);
  }
  withComment.forEach((task) => {
    const li = document.createElement("li");
    const head = document.createElement("div");
    head.className = "mono";
    head.textContent = `${task.id} · ${answerOf(task.id).d ? DEC_LABEL[answerOf(task.id).d] : "Sans décision"}`;
    const body = document.createElement("div");
    body.textContent = answerOf(task.id).c;
    body.style.whiteSpace = "pre-wrap";
    li.append(head, body);
    list.appendChild(li);
  });
  document.getElementById("exportbox").value = buildExport();
}

/* ----------------------------- persistence -------------------------- */
function localSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(answers)); } catch (e) { /* storage unavailable */ }
}
function localLoad() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) Object.assign(answers, JSON.parse(raw));
  } catch (e) { /* storage unavailable */ }
}

function queueWrite(id, delay) {
  dirty.add(id);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), delay);
  setStatus("saving", "Enregistrement…");
}

function flush(id) {
  const a = answerOf(id);
  if (!db) {
    localSave();
    dirty.delete(id);
    setStatus("local", "Enregistré dans ce navigateur seulement");
    return Promise.resolve();
  }
  const previous = chains[id] || Promise.resolve();
  chains[id] = previous.then(async () => {
    const ref = db.doc(`answers/${id}`);
    try {
      if (!a.d && !a.o && !(a.c || "").trim()) await ref.delete();
      else await ref.set({ d: a.d, o: a.o, c: a.c, v: a.v || 1, p: a.p || null, at: Date.now() });
      dirty.delete(id);
      setStatus("saved", "Enregistré");
    } catch (error) {
      setStatus("error", "Enregistrement refusé : réessayez ou utilisez la synthèse");
      localSave();
    }
  });
  return chains[id];
}

function normalizeOne(task) {
  const a = answers[task.id];
  if (!a) return false;
  if ((a.v || 1) < (task.v || 1)) {
    if (a.d || a.o) a.p = { d: a.d, o: a.o };
    a.d = "";
    a.o = "";
    a.v = task.v || 1;
    return true;
  }
  return false;
}
function normalizeAnswers() {
  let changed = false;
  ALL_TASKS.forEach((task) => { if (normalizeOne(task)) changed = true; });
  if (changed) localSave();
}

function update(id, patch) {
  const task = TASK_BY_ID[id];
  answers[id] = Object.assign({ d: "", o: "", c: "" }, answers[id] || {}, patch, { v: task.v || 1 });
  if (answers[id].d) delete answers[id].p;
  refreshCard(id);
  updateCounts();
}

async function connect() {
  localLoad();
  seedIfEmpty();
  normalizeAnswers();
  Object.keys(answers).forEach(refreshCard);
  updateCounts();
  try { downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) {
    setStatus("local", "Enregistré dans ce navigateur seulement");
    return;
  }
  setStatus("init", "Chargement des réponses…");
  const slow = setTimeout(() => setStatus("error", "Le stockage met du temps à répondre : vos réponses restent saisies ici"), 10000);
  db.collection("answers").onSnapshot((snap) => {
    if (!snap.metadata.fromCache) clearTimeout(slow);
    snap.docChanges().forEach((change) => {
      const id = change.doc.id;
      if (!TASK_BY_ID[id] || dirty.has(id)) return;
      if (change.type === "removed") { delete answers[id]; }
      else {
        const v = change.doc.data() || {};
        answers[id] = { d: v.d || "", o: v.o || "", c: v.c || "", v: v.v || 1, p: v.p };
        normalizeOne(TASK_BY_ID[id]);
      }
      refreshCard(id);
    });
    updateCounts();
    if (!snap.metadata.fromCache && !dirty.size) setStatus("saved", "Enregistré");
  }, () => {
    clearTimeout(slow);
    db = null;
    setStatus("local", "Stockage indisponible : enregistré dans ce navigateur seulement");
  });
}

/* ------------------------------- events ----------------------------- */
function showTab(id, focus) {
  activeTab = id;
  document.querySelectorAll(".tab").forEach((tab) => {
    const on = tab.dataset.tab === id;
    tab.setAttribute("aria-selected", String(on));
    tab.tabIndex = on ? 0 : -1;
    if (on && focus) tab.focus();
  });
  document.querySelectorAll(".panel").forEach((panel) => { panel.hidden = panel.id !== `panel-${id}`; });
  if (id === "synthese") renderSummary();
  try {
    if (location.hash.slice(1) !== `tab-${id}`) history.replaceState(null, "", `#tab-${id}`);
  } catch (e) { /* the frame may refuse history changes */ }
  window.scrollTo({ top: 0 });
}

document.addEventListener("click", (event) => {
  const tab = event.target.closest(".tab");
  if (tab) { showTab(tab.dataset.tab); return; }
  const chip = event.target.closest(".chip");
  if (chip) { filter = chip.dataset.filter; applyFilter(); return; }
  const go = event.target.closest("[data-goto]");
  if (go) {
    event.preventDefault();
    const task = TASK_BY_ID[go.dataset.goto];
    if (task) {
      showTab(task.tab);
      filter = "all"; applyFilter();
      const card = document.getElementById(`task-${task.id}`);
      if (card) card.scrollIntoView({ block: "start" });
    }
    return;
  }
  const clear = event.target.closest("[data-clear]");
  if (clear) {
    const id = clear.dataset.clear;
    update(id, { d: "", o: "" });
    queueWrite(id, 0);
    return;
  }
  const rest = event.target.closest("[data-validate-rest]");
  if (rest) {
    const tab = TABS.find((t) => t.id === rest.dataset.validateRest);
    tab.tasks.forEach((task) => {
      if (!answerOf(task.id).d && !answerOf(task.id).p) { update(task.id, { d: "ok" }); queueWrite(task.id, 0); }
    });
    return;
  }
  if (event.target.closest("#btn-copy")) copyExport();
  if (event.target.closest("#btn-save")) saveExport();
  if (event.target.closest("#btn-reset")) resetAll();
});

document.addEventListener("change", (event) => {
  const input = event.target;
  if (input.matches('input[type="radio"]')) {
    const card = input.closest(".card");
    if (!card) return;
    const id = card.dataset.id;
    if (input.name === `d-${id}`) update(id, { d: input.value });
    if (input.name === `o-${id}`) update(id, { o: input.value });
    queueWrite(id, 0);
  }
});

document.addEventListener("input", (event) => {
  const area = event.target;
  if (area.matches(".card textarea")) {
    const id = area.closest(".card").dataset.id;
    answers[id] = Object.assign({ d: "", o: "", c: "" }, answers[id] || {}, { c: area.value }, { v: TASK_BY_ID[id].v || 1 });
    updateCounts();
    queueWrite(id, 700);
  }
});

document.getElementById("tabs").addEventListener("keydown", (event) => {
  const order = TABS.map((t) => t.id).concat("synthese");
  const index = order.indexOf(activeTab);
  let next = -1;
  if (event.key === "ArrowRight") next = (index + 1) % order.length;
  if (event.key === "ArrowLeft") next = (index - 1 + order.length) % order.length;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = order.length - 1;
  if (next >= 0) { event.preventDefault(); showTab(order[next], true); }
});

async function copyExport() {
  const text = buildExport();
  const note = document.getElementById("export-note");
  try {
    await navigator.clipboard.writeText(text);
    note.textContent = "Synthèse copiée.";
  } catch (e) {
    const box = document.getElementById("exportbox");
    box.focus(); box.select();
    note.textContent = "Copie refusée : le texte est sélectionné, copiez-le avec Ctrl+C.";
  }
}
async function saveExport() {
  const note = document.getElementById("export-note");
  const filename = "retrait-rst-decisions.md";
  const text = buildExport();
  if (downloads) {
    try {
      await downloads.save({ filename, data: text });
      note.textContent = "Fichier enregistré.";
    } catch (e) {
      note.textContent = e && e.code === "declined" ? "Enregistrement annulé." : "Enregistrement impossible : utilisez la copie.";
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    note.textContent = "Fichier " + filename + " envoyé vers le dossier de téléchargements.";
  } catch (e) {
    note.textContent = "Enregistrement impossible : utilisez la copie.";
  }
}
async function resetAll() {
  const button = document.getElementById("btn-reset");
  if (button.dataset.armed !== "1") {
    button.dataset.armed = "1";
    button.textContent = "Confirmer l'effacement";
    setTimeout(() => { button.dataset.armed = ""; button.textContent = "Effacer toutes les réponses"; }, 5000);
    return;
  }
  button.dataset.armed = "";
  button.textContent = "Effacer toutes les réponses";
  const ids = Object.keys(answers);
  ids.forEach((id) => { delete answers[id]; refreshCard(id); });
  localSave();
  updateCounts();
  if (db) {
    for (const id of ids) { try { await db.doc(`answers/${id}`).delete(); } catch (e) { /* ignore */ } }
  }
  document.getElementById("export-note").textContent = "Réponses effacées.";
}

/* -------------------------------- boot ------------------------------ */
buildPage();
const initial = location.hash.replace(/^#tab-/, "");
showTab(TABS.concat([{ id: "synthese" }]).some((t) => t.id === initial) ? initial : "cadrage");
window.addEventListener("hashchange", () => {
  const id = location.hash.replace(/^#tab-/, "");
  if (id !== activeTab && TABS.concat([{ id: "synthese" }]).some((t) => t.id === id)) showTab(id);
});
applyFilter();
updateCounts();
connect();
</script>
