<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>Plan Markdown seul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky frame (title, progress, tabs) above one panel of decision cards per theme. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eaeff3;
  --ink: #15212b;
  --muted: #566574;
  --line: #d3dce3;
  --accent: #0a6a8a;
  --accent-ink: #ffffff;
  --ok: #17703f;
  --ok-bg: #e0f3e8;
  --talk: #8a5200;
  --talk-bg: #fcefd2;
  --ko: #a82a22;
  --ko-bg: #fae1de;
  --code-bg: #e6ecf0;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820;
    --surface: #17222b;
    --surface-2: #1e2c37;
    --ink: #e6edf2;
    --muted: #9db0bf;
    --line: #2d3c48;
    --accent: #52bde0;
    --accent-ink: #052330;
    --ok: #5cc790;
    --ok-bg: #12301f;
    --talk: #e6ad4f;
    --talk-bg: #33260c;
    --ko: #f2918a;
    --ko-bg: #3b1916;
    --code-bg: #223340;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820;
  --surface: #17222b;
  --surface-2: #1e2c37;
  --ink: #e6edf2;
  --muted: #9db0bf;
  --line: #2d3c48;
  --accent: #52bde0;
  --accent-ink: #052330;
  --ok: #5cc790;
  --ok-bg: #12301f;
  --talk: #e6ad4f;
  --talk-bg: #33260c;
  --ko: #f2918a;
  --ko-bg: #3b1916;
  --code-bg: #223340;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 0 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
code, pre, .mono { font-family: var(--font-mono); font-size: 0.9em; }
code { background: var(--code-bg); padding: 0.05em 0.35em; border-radius: 3px; }
pre { background: var(--code-bg); padding: 0.7rem 0.9rem; border-radius: 4px; overflow-x: auto; margin: 0.6rem 0; }
pre code { background: none; padding: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.frame {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.frame__top {
  max-width: 1080px;
  margin-inline: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1.5rem;
  padding-block: 0.7rem 0.5rem;
}
.frame h1 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0;
  letter-spacing: 0.005em;
  text-wrap: balance;
}
.progress {
  flex: 1 1 260px;
  min-width: 0;
  display: grid;
  gap: 0.25rem;
}
.progress__bar {
  height: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex;
  overflow: hidden;
}
.progress__bar span { display: block; height: 100%; }
.progress__bar .p-ok { background: var(--ok); }
.progress__bar .p-talk { background: var(--talk); }
.progress__bar .p-ko { background: var(--ko); }
.progress__text { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.savestate { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.savestate[data-s="error"] { color: var(--ko); }

.tabs-wrap { max-width: 1080px; margin-inline: auto; overflow-x: auto; }
.tabs { display: flex; gap: 0.15rem; min-width: max-content; padding-bottom: 0; }
.tab {
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 500;
  padding: 0.55rem 0.8rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab__count {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  min-width: 1.6rem;
  text-align: center;
  padding: 0.05rem 0.35rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
}
.tab__count[data-done="true"] { background: var(--ok-bg); color: var(--ok); border-color: transparent; }

main { max-width: 1080px; margin-inline: auto; padding-top: 1.2rem; }
.panel[hidden] { display: none; }
.panel__intro { max-width: 70ch; margin-bottom: 1rem; }
.panel__intro h2 { font-size: 1.35rem; margin: 0 0 0.3rem; text-wrap: balance; }
.panel__intro p { margin: 0.4rem 0; color: var(--muted); }
.panel__intro p strong { color: var(--ink); font-weight: 600; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1rem;
  align-items: center;
  margin: 0.6rem 0 1rem;
  font-size: 0.85rem;
}
.toolbar__label { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.chip {
  appearance: none;
  font: inherit;
  font-size: 0.82rem;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.2rem 0.7rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn {
  appearance: none;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.35rem 0.8rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn--danger { color: var(--ko); }
.btn[disabled] { opacity: 0.5; cursor: default; }

.cards { display: grid; gap: 0.9rem; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.9rem 1rem 1rem;
  min-width: 0;
  display: grid;
  gap: 0.6rem;
  scroll-margin-top: 9rem;
}
.card[hidden] { display: none; }
.card[data-state="ok"] { border-color: var(--ok); }
.card[data-state="talk"] { border-color: var(--talk); }
.card[data-state="ko"] { border-color: var(--ko); }
.card__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.7rem; }
.card__id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.card__title { font-size: 1.02rem; font-weight: 600; margin: 0; flex: 1 1 240px; min-width: 0; text-wrap: balance; }
.pill {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.card[data-state="ok"] .pill--state { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.card[data-state="talk"] .pill--state { background: var(--talk-bg); color: var(--talk); border-color: transparent; }
.card[data-state="ko"] .pill--state { background: var(--ko-bg); color: var(--ko); border-color: transparent; }
.card__meta { display: flex; flex-wrap: wrap; gap: 0.35rem; font-size: 0.78rem; }
.meta {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  padding: 0.1rem 0.5rem;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--muted);
  background: var(--surface-2);
}
.meta--risk-e { color: var(--ko); }
.meta--risk-m { color: var(--talk); }
.meta--risk-f { color: var(--ok); }
.meta a { color: inherit; }
.card__body { max-width: 74ch; }
.card__body p { margin: 0.35rem 0; }
.card__body ul, .card__body ol { margin: 0.35rem 0; padding-left: 1.25rem; }
.card__body li { margin: 0.15rem 0; }
.card__files summary { cursor: pointer; font-size: 0.82rem; color: var(--muted); }
.card__files ul { margin: 0.35rem 0 0; padding-left: 1.1rem; font-family: var(--font-mono); font-size: 0.78rem; overflow-wrap: anywhere; }
.options {
  border: 1px dashed var(--line);
  border-radius: 4px;
  padding: 0.55rem 0.8rem 0.65rem;
  margin: 0;
  min-width: 0;
}
.options legend { font-size: 0.8rem; font-weight: 600; padding-inline: 0.3rem; color: var(--muted); }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 0.1rem 0.55rem; padding: 0.3rem 0; align-items: start; }
.opt input { margin-top: 0.3rem; }
.opt__label { font-weight: 500; }
.opt__x { grid-column: 2; color: var(--muted); font-size: 0.88rem; }
.opt__x code { font-size: 0.82em; }
.rec { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 0.3rem; margin-left: 0.4rem; }
.decide { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; }
.seg { display: inline-flex; flex-wrap: wrap; border: 0; padding: 0; margin: 0; gap: 0.35rem; }
.seg label { cursor: pointer; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span {
  display: inline-block;
  padding: 0.3rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  font-size: 0.88rem;
  font-weight: 500;
  user-select: none;
}
.seg label:hover span { border-color: var(--accent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg input[value="ok"]:checked + span { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.seg input[value="talk"]:checked + span { background: var(--talk); color: var(--surface); border-color: var(--talk); }
.seg input[value="ko"]:checked + span { background: var(--ko); color: var(--surface); border-color: var(--ko); }
.clear { font-size: 0.78rem; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; font: inherit; font-size: 0.78rem; }
.clear[hidden] { display: none; }
.comment { display: grid; gap: 0.2rem; font-size: 0.8rem; color: var(--muted); }
.comment textarea {
  width: 100%;
  font: inherit;
  font-size: 0.92rem;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.45rem 0.6rem;
  resize: vertical;
  min-height: 2.8rem;
}

.card[data-state="stale"] { border-style: dashed; border-color: var(--accent); }
.card[data-state="stale"] .pill--state { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pill--new { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pill--mod { color: var(--accent); border-color: var(--accent); background: var(--surface); }
.dec, .stale-note {
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 0.4rem 0.7rem;
  font-size: 0.88rem;
  max-width: 74ch;
}
.dec p { margin: 0.25rem 0; }
.dec__label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: block; }
.stale-note { border-color: var(--accent); }
.stale-note[hidden] { display: none; }
.group-title { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 1.4rem 0 0.2rem; }
.legend { font-size: 0.82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; margin-top: 0.5rem; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
.table-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table.sum th, table.sum td { padding: 0.5rem 0.8rem; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.sum th:first-child, table.sum td:first-child { text-align: left; white-space: normal; }
table.sum thead th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
table.sum tfoot td { font-weight: 600; border-bottom: 0; }
.commentlist { display: grid; gap: 0.5rem; margin: 0.6rem 0 0; padding: 0; list-style: none; }
.commentlist li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0.55rem 0.8rem; }
.commentlist .mono { color: var(--muted); font-size: 0.78rem; }
.exportbox { width: 100%; min-height: 12rem; font-family: var(--font-mono); font-size: 0.8rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0.6rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0; align-items: center; }
.note { font-size: 0.85rem; color: var(--muted); max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) {
  .progress__bar span { transition: width 0.25s ease; }
}
@media (max-width: 560px) {
  .card { padding: 0.75rem 0.8rem 0.85rem; }
  .tab { padding-inline: 0.6rem; }
}
</style>
</head>
<body>
<div class="frame">
  <div class="frame__top">
    <h1>Retrait de RST : plan à valider · révision 2</h1>
    <div class="progress" aria-live="polite">
      <div class="progress__bar" aria-hidden="true"><span class="p-ok" id="bar-ok"></span><span class="p-talk" id="bar-talk"></span><span class="p-ko" id="bar-ko"></span></div>
      <div class="progress__text" id="progress-text"></div>
    </div>
    <div class="savestate" id="savestate" data-s="init">Chargement des réponses…</div>
  </div>
  <div class="tabs-wrap"><div class="tabs" role="tablist" aria-label="Thèmes du plan" id="tabs"></div></div>
</div>

<main id="main"></main>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Plan data. e: effort S (0,5 j), M (1 à 2 j), L (3 à 5 j).
 * r: risk f (faible), m (moyen), e (élevé). o: choices; "rec" marks the
 * recommended one. A task validated with no choice means "recommended".
 * ------------------------------------------------------------------ */
const TABS = [
  { id: "cadrage", label: "Cadrage",
    title: "Cadrage et décisions préalables",
    intro: `<p><strong>Comment lire ce plan.</strong> Chaque carte est une tâche. Choisissez Valider, À discuter ou Invalider, puis ajoutez un commentaire. Quand une tâche propose des variantes, cochez celle que vous voulez ; sans choix, j'applique la variante recommandée.</p>
    <p><strong>Ordre.</strong> J'ai lu « commencer par 1 » comme le cas A : retirer d'abord l'export RST. Puis les alternatives HTML pour ce que Markdown ne sait pas faire, puis le convertisseur RST vers Markdown, puis le retrait du balisage RST.</p>
    <p><strong>Hors alternatives HTML</strong> (selon votre consigne) : tableaux, images, csv-table. Ils ne sont pas traités comme fonctions à remplacer en HTML, mais le convertisseur doit bien les transformer (onglet Convertisseur).</p>`,
    tasks: [
      { id: "C-01", t: "Ordre des phases", e: "S", r: "f",
        d: `<p>Phase 1 : retrait de l'export RST. Phase 2 : alternatives HTML. Phase 3 : convertisseur. Migration des contenus. Phase 4 : retrait du balisage RST du code. Le balisage RST n'est supprimé qu'après la migration complète, pour ne jamais casser un document existant.</p>`,
        o: [ { k: "a", l: "Export RST d'abord, balisage ensuite (ordre ci-dessus)", rec: 1 },
             { k: "b", l: "Les deux en même temps", x: "Un seul gros lot : moins de commits, mais impossible de revenir sur l'un sans l'autre." },
             { k: "c", l: "Balisage RST d'abord", x: "Pas recommandé : l'export RST réutilise le rendu RST." } ] },
      { id: "C-02", t: "Constat sur vos données réelles", e: "S", r: "f",
        d: `<p>Dans <code>~/strictdoc-data</code> le document REQ_02 est déjà en <code>MARKUP: Markdown</code> : 131 exigences, 23 textes, aucune directive RST, aucun tableau RST. Son profil Word déclare déjà <code>markup="Markdown"</code>. Un fichier <code>.rst.bak</code> traîne à côté (sauvegarde d'un ancien import).</p>
        <p>Le poids du retrait se trouve donc surtout dans StrictDoc lui-même : 15 documents de <code>docs/</code> en RST implicite, 94 fichiers <code>.sdoc</code> avec directives RST, environ 1 770 <code>.sdoc</code> de tests sans balisage déclaré (donc RST par défaut).</p>
        <p>Y a-t-il d'autres projets ISIS que REQ_02 écrits en RST ? Dites-le en commentaire ; la tâche M-01 les inventorie.</p>`,
        u: "REQ_02 : 0 directive RST" },
      { id: "C-03", t: "Balisages conservés", e: "S", r: "m",
        d: `<p>« Ne conserver que Markdown » peut vouloir dire Markdown seul, ou Markdown plus les deux balisages simples déjà présents. <code>HTML</code> sert à l'import ReqIF XHTML (<code>--reqif-import-markup HTML</code>) et <code>Text</code> à des rendus internes ; 14 <code>.sdoc</code> de tests les utilisent.</p>`,
        o: [ { k: "a", l: "Markdown, HTML et Text", rec: 1, x: "Seul RST disparaît. Coût minimal, aucun import ReqIF cassé." },
             { k: "b", l: "Markdown et HTML", x: "Supprime Text ; les rendus internes passent en Markdown." },
             { k: "c", l: "Markdown seul", x: "Plus propre mais casse l'import ReqIF XHTML et ajoute du travail de conversion." } ] },
      { id: "C-04", t: "Conteneur des documents", e: "S", r: "f",
        d: `<p>Le formulaire d'édition riche (Milkdown) ne s'applique qu'aux champs de contenu d'un document dont le balisage est Markdown. Deux façons de « garder Markdown » : le conteneur <code>.sdoc</code> avec <code>MARKUP: Markdown</code>, ou des fichiers <code>.md</code> natifs. Les deux existent déjà.</p>`,
        o: [ { k: "a", l: "Garder .sdoc avec MARKUP: Markdown", rec: 1, x: "Grammaire riche, relations, ROLE, champs personnalisés conservés." },
             { k: "b", l: "Passer les documents en .md natifs", x: "Chantier distinct, plus lourd ; à planifier à part." } ] },
      { id: "C-05", t: "Balisage par défaut après retrait", e: "M", r: "e",
        d: `<p>Aujourd'hui <code>DocumentConfig.get_markup()</code> renvoie RST quand rien n'est écrit. Après le retrait, un document sans <code>MARKUP</code> serait lu en Markdown : un ancien contenu RST s'afficherait faux, sans erreur.</p>`,
        o: [ { k: "a", l: "Markdown par défaut, et la migration écrit MARKUP: Markdown partout", rec: 1, x: "Ajoute un avertissement si un champ ressemble à du RST (directive, double accent grave)." },
             { k: "b", l: "Balisage obligatoire", x: "Erreur de lecture si MARKUP est absent. Sûr mais rompt tous les documents existants." },
             { k: "c", l: "Garder RST comme défaut implicite, avec avertissement", x: "Ne supprime pas vraiment RST." } ] },
      { id: "C-06", t: "Période de dépréciation", e: "S", r: "m",
        d: `<p>Vous êtes seul utilisateur de ce fork. Une dépréciation en deux versions protège pourtant le temps de convertir et de relire.</p>`,
        o: [ { k: "a", l: "Deux étapes : avertissement et lecture RST, puis retrait", rec: 1 },
             { k: "b", l: "Retrait direct", x: "Plus court, pas de filet de sécurité." } ] },
      { id: "C-07", t: "Politique vis-à-vis de l'amont", e: "M", r: "e",
        d: `<p>L'amont continue à développer RST : alignement des tableaux en grille, liens dans les tableaux RST, widgets de champ pour RST. Supprimer RST rend ce travail inutile et fait entrer chaque fusion en conflit avec le code retiré.</p>`,
        o: [ { k: "a", l: "Divergence assumée : plus de fusion globale, cherry-pick des correctifs utiles", rec: 1, x: "Avant le retrait : reprendre les correctifs ciblés (cycles avec rôle, commentaires multiples en Markdown, restriction du clone, ReqIF et Excel)." },
             { k: "b", l: "Rester aligné sur l'amont", x: "Incompatible avec la suppression de RST." } ] },
      { id: "C-08", t: "Branche, étiquette et rythme de livraison", e: "S", r: "f",
        d: `<p>Branche <code>feature/markdown-only</code> depuis <code>develop</code>, une demande de fusion par phase (P1, P2, P3, migration, P4). Étiquette Git <code>pre-markdown-only</code> sur <code>develop</code> avant la première phase, car la conversion RST vers Markdown est irréversible. Chaque commit passe <code>invoke check</code> (règle du guide du développeur).</p>` },
      { id: "C-09", t: "Critères de fin", e: "S", r: "f",
        d: `<ul><li>Suites unitaires, d'intégration et end2end vertes.</li><li><code>invoke docs</code> produit le site de documentation.</li><li>L'export HTML de REQ_02 est identique, au texte près, avant et après.</li><li>Plus aucun <code>MARKUP: RST</code> dans le dépôt, plus de <code>docutils</code> à l'exécution.</li><li>Aucune régression de performance sur l'export de <code>docs/</code>.</li></ul>` }
    ] },

  { id: "p1", label: "1 · Export RST",
    title: "Phase 1 : retirer l'export RST (cas A)",
    intro: `<p>L'export RST (<code>--formats=rst</code>) produit des fichiers pour Sphinx. Aucune autre fonction n'en dépend. Le rendu RST des champs (docutils) reste en place jusqu'à la phase 4.</p>`,
    tasks: [
      { id: "P1-01", t: "Retirer le format rst de la CLI et de la configuration", e: "S", r: "f",
        d: `<p>Enlever <code>"rst"</code> de <code>EXPORT_FORMATS</code>, <code>RSTFormat()</code> de <code>ProjectConfig.default_formats()</code>, et vérifier que le lanceur graphique (qui importe <code>EXPORT_FORMATS</code>) ne propose plus le format.</p>`,
        f: ["strictdoc/commands/export.py", "strictdoc/core/project_config.py", "strictdoc/features/launcher/launcher_frame.py"],
        o: [ { k: "a", l: "Erreur claire : « le format rst a été retiré »", rec: 1 },
             { k: "b", l: "Avertissement pendant une version, puis erreur", x: "Suit l'option C-06 b." } ] },
      { id: "P1-02", t: "Supprimer le code de l'export RST", e: "S", r: "f",
        d: `<p>Supprimer <code>RSTFormat</code>, <code>DocumentRSTGenerator</code>, <code>RSTWriter</code>, <code>RSTTemplates</code> et le template <code>requirement.jinja.rst</code>. Garder pour l'instant <code>formatter.py</code> (utilisé par l'écriture des <code>.sdoc</code>), le rendu HTML RST, le lexeur et les directives : ils partent en phase 4.</p>`,
        f: ["strictdoc/backend/rst/rst_format.py", "strictdoc/backend/rst/document_rst_generator.py", "strictdoc/backend/rst/writer.py", "strictdoc/backend/rst/rst_templates.py", "strictdoc/backend/rst/templates/requirement.jinja.rst"] },
      { id: "P1-03", t: "Nettoyer les chemins de gabarits et le packaging", e: "S", r: "f",
        d: `<p>Retirer <code>get_path_to_rst_templates()</code> de l'environnement et les références aux gabarits RST dans les options de données PyInstaller et Nuitka, si elles existent. À vérifier avec une recherche <code>git grep</code> avant de supprimer.</p>`,
        f: ["strictdoc/core/environment.py", "tasks.py"] },
      { id: "P1-04", t: "Supprimer ou adapter les tests de l'export RST", e: "M", r: "f",
        d: `<p>Supprimer <code>tests/integration/features/rst/</code> (17 tests d'intégration). Trois autres tests utilisent <code>--formats=rst</code> et sont à adapter : <code>html/rst_markup_to_html/20_csv_table</code>, <code>html/utf8/01_utf8_in_sdoc</code> et <code>tests/unit/strictdoc/cli/test_cli_arg_parser.py</code>.</p>`,
        f: ["tests/integration/features/rst/", "tests/integration/features/html/rst_markup_to_html/20_csv_table/test.itest", "tests/integration/features/html/utf8/01_utf8_in_sdoc/test.itest", "tests/unit/strictdoc/cli/test_cli_arg_parser.py"] },
      { id: "P1-05", t: "Mettre à jour le guide utilisateur et les exigences", e: "M", r: "f",
        d: `<p>Retirer les sections « HTML export via Sphinx » et « Wildcard image paths for RST/Sphinx export », la ligne de la carte des fonctions, les exigences SDOC-SRS de l'export RST, et les marqueurs <code>@relation</code> des fichiers supprimés pour garder la traçabilité propre.</p>`,
        f: ["docs/strictdoc_01_user_guide.sdoc", "docs/strictdoc_02_feature_map.sdoc", "docs/strictdoc_21_l2_high_level_requirements.sdoc", "docs/strictdoc_22_l3_low_level_requirements.sdoc"] },
      { id: "P1-06", t: "Alternative pour qui utilisait Sphinx", e: "S", r: "f",
        d: `<p>Documenter ce que l'on fait à la place : l'export Markdown existe déjà. Une page « Migrer de Sphinx » dirait comment passer par <code>--formats=markdown</code> puis un outil externe. Si vous n'utilisez pas Sphinx, cette tâche est inutile.</p>`,
        o: [ { k: "a", l: "Page de migration courte", rec: 1 }, { k: "b", l: "Aucune documentation", x: "Vous n'avez pas de flux Sphinx." } ] },
      { id: "P1-07", t: "Notes de version et commit de rupture", e: "S", r: "f",
        d: `<p>Entrée dans « Unreleased » des notes de version, et message de commit <code>feat!(export): remove the RST export</code>.</p>`,
        f: ["docs/strictdoc_04_release_notes.sdoc"] }
    ] },

  { id: "p2", label: "2 · Alternatives HTML",
    title: "Phase 2 : alternatives HTML pour les fonctions RST perdues",
    intro: `<p>Le rendu Markdown de StrictDoc accepte le HTML brut (<code>html: True</code>). Quand Markdown n'a pas l'équivalent d'une fonction RST, la phase 2 définit un HTML standard, un style, et la façon dont l'éditeur, le PDF et Word le traitent. Une ligne vide dans un bloc HTML redonne la main à Markdown : on garde donc du Markdown dans les encadrés.</p>
    <p><strong>Hors périmètre ici :</strong> tableaux, images, csv-table (voir le convertisseur). La ligne « Usage » donne le nombre d'occurrences dans tous les <code>.sdoc</code> du dépôt, pour fixer les priorités.</p>`,
    tasks: [
      { id: "P2-00", t: "Étude préalable : l'éditeur Milkdown garde-t-il le HTML ?", e: "M", r: "e",
        d: `<p>Tout le plan suppose qu'un document Markdown contenant un encadré HTML survit à une édition dans Milkdown. Aujourd'hui seuls les tableaux HTML aux balises connues sont relus comme tableaux ; le HTML inconnu est peut-être perdu ou enveloppé.</p>
        <p>Livrable : un rapport sur des échantillons (<code>div</code> avec classe, <code>dl</code>, <code>sup</code>, <code>sub</code>, <code>aside</code>, commentaires HTML) et, si besoin, une extension de l'éditeur qui les conserve octet pour octet.</p>`,
        f: ["developer/milkdown/src/", "developer/milkdown/playwright/", "strictdoc/features/milkdown/assets/milkdown/"],
        o: [ { k: "a", l: "Faire l'étude avant toute autre tâche de cette phase", rec: 1 }, { k: "b", l: "Supposer que c'est bon et tester à la fin", x: "Risque de refaire tout le format." } ] },
      { id: "P2-01", t: "Politique de sécurité du HTML brut", e: "M", r: "e",
        d: `<p>Le rendu Markdown actuel laisse passer n'importe quel HTML, scripts compris. Des relecteurs ne modifient pas le texte, mais des auteurs et des imports Word ou ReqIF peuvent en écrire. En s'appuyant davantage sur le HTML, il faut décider de ce qui est permis.</p>
        <p>Cette faille existe déjà aujourd'hui pour les documents Markdown ; le retrait de RST la rend plus visible, il ne la crée pas.</p>`,
        f: ["strictdoc/backend/markdown/markdown_to_html_fragment_writer.py", "strictdoc/features/svg/sanitizer.py (modèle à suivre)"],
        o: [ { k: "a", l: "Liste blanche de balises et d'attributs, comme pour les SVG", rec: 1, x: "div, p, span, aside, dl, dt, dd, sup, sub, table et ses cellules, class et role autorisés, scripts et gestionnaires d'événements refusés." },
             { k: "b", l: "Ne rien changer", x: "On fait confiance aux auteurs." },
             { k: "c", l: "Interdire le HTML brut, fournir des syntaxes dédiées", x: "Demande des extensions du parseur Markdown pour chaque fonction." } ] },
      { id: "P2-02", t: "Feuille de style commune des éléments de remplacement", e: "M", r: "m",
        d: `<p>Un fichier CSS <code>sdoc-markup.css</code> : encadrés (une couleur et une icône par type), listes de définitions, notes de bas de page, thème clair et sombre, styles d'impression pour le PDF. Classes préfixées <code>sdoc-</code> pour ne pas entrer en conflit.</p>
        <p><strong>Accord requis :</strong> ce fichier est chargé par <code>base.jinja.html</code>, un composant partagé. Les règles du dépôt demandent votre accord avant de le toucher.</p>`,
        f: ["strictdoc/export/html/_static/", "strictdoc/export/html/templates/base.jinja.html", "strictdoc/core/environment.py"] },
      { id: "P2-10", t: "Encadrés : note, warning, tip, important, caution, danger, attention, hint, error, admonition", e: "M", r: "m", u: "51 note, 8 warning, 5 admonition",
        d: `<p>Équivalent des directives RST <code>.. note::</code> et voisines. Forme recommandée :</p>
        <pre><code>&lt;div class="sdoc-admonition sdoc-note" role="note"&gt;
&lt;p class="sdoc-admonition-title"&gt;Note&lt;/p&gt;

Texte en **Markdown**.

&lt;/div&gt;</code></pre>
        <p>Les lignes vides laissent Markdown fonctionner à l'intérieur. Le titre est écrit dans le document, donc dans la langue du document ; il est exportable et indexé.</p>`,
        o: [ { k: "a", l: "Bloc HTML avec classes sdoc-admonition", rec: 1, x: "Le titre est dans le HTML. Rendu identique en HTML, PDF, recherche." },
             { k: "b", l: "Citation GitHub (> [!NOTE]) avec une extension du rendu Markdown", x: "Syntaxe plus courte, mais ce n'est plus du HTML et il faut une extension du parseur et de l'éditeur." },
             { k: "c", l: "Citation Markdown avec mot en gras (> **Note.** texte)", x: "Aucune extension, pas de couleur par type sans CSS sur blockquote." } ] },
      { id: "P2-11", t: "Notes de bas de page et citations", e: "S", r: "f", u: "0 occurrence",
        d: `<p>Aucun usage dans le dépôt. Si on garde une alternative : ancres StrictDoc natives, qui sont vérifiées par l'index et donnent des liens entrants.</p>`,
        o: [ { k: "a", l: "Ancre [ANCHOR: fn-1, \"1\"] et lien [LINK: fn-1]", rec: 1 },
             { k: "b", l: "HTML : sup avec lien vers un aside", x: "Autonome mais non vérifié par l'index." },
             { k: "c", l: "Ne pas remplacer : perte assumée", x: "Convertir en texte entre parenthèses, avec avertissement." } ] },
      { id: "P2-12", t: "Listes de définitions", e: "S", r: "f", u: "non mesuré",
        d: `<p>HTML : <code>&lt;dl&gt;&lt;dt&gt;Terme&lt;/dt&gt;&lt;dd&gt;Définition&lt;/dd&gt;&lt;/dl&gt;</code>. Le convertisseur compte les occurrences réelles dans son rapport ; si elles sont rares, on les convertit en liste à puces avec le terme en gras.</p>`,
        o: [ { k: "a", l: "Balises dl, dt, dd", rec: 1 }, { k: "b", l: "Liste à puces avec terme en gras", x: "Aucun HTML." } ] },
      { id: "P2-13", t: "Rôles RST en ligne", e: "S", r: "f", u: "14 :code:, 7 :eq:, 5 :math:",
        d: `<ul><li><code>:code:</code> devient des apostrophes inverses ; <code>:math:</code> devient <code>$…$</code>.</li>
        <li><code>:sup:</code> et <code>:sub:</code> deviennent <code>&lt;sup&gt;</code> et <code>&lt;sub&gt;</code>.</li>
        <li><code>:rawhtml:</code> (rôle maison) devient le HTML brut.</li>
        <li><code>:ref:</code> et <code>:doc:</code> (Sphinx) deviennent <code>[LINK: uid]</code> quand la cible est un nœud, sinon un lien Markdown.</li>
        <li><code>:eq:</code> renvoie à une équation numérotée par <code>.. math:: :label:</code>. Markdown n'a pas d'étiquettes.</li></ul>`,
        o: [ { k: "a", l: "Équation numérotée écrite \\tag{n} dans $$…$$, renvoi remplacé par le numéro en texte", rec: 1 },
             { k: "b", l: "Supprimer la numérotation, garder les formules", x: "Les 7 renvois :eq: deviennent du texte simple." } ] },
      { id: "P2-14", t: "Numéros de ligne dans les blocs de code", e: "S", r: "f", u: "249 blocs de code, 1 seul fichier avec :number-lines:",
        d: `<p>Vérifié avec docutils 0.23 : le réglage <code>syntax_highlight_opts = {linenos: inline}</code> de StrictDoc n'a aucun effet. Un bloc de code RST n'a de numéros de ligne que si l'on écrit <code>:number-lines:</code>. Seul un fichier du dépôt le fait (<code>docs/strictdoc_22_l3_low_level_requirements.sdoc</code>, 3 blocs). Ce que Markdown perd est donc minime.</p>`,
        o: [ { k: "a", l: "Accepter la perte (Markdown n'en a pas)", rec: 1 },
             { k: "b", l: "Indice dans la clôture (```python linenos), géré par le rendu Markdown", x: "Extension du rendu, pas du HTML pur." },
             { k: "c", l: "Bloc HTML pre avec classe sdoc-linenos et compteur CSS", x: "Du HTML, mais le code n'est plus un bloc Markdown, donc pas de coloration par l'éditeur." } ] },
      { id: "P2-15", t: "Blocs raw, HTML et autres cibles", e: "S", r: "f", u: "16 .. raw::",
        d: `<p><code>.. raw:: html</code> devient du HTML brut : équivalent natif. Les autres cibles (<code>latex</code>, <code>pdf</code>, ...) n'ont pas de sens dans un nœud : supprimées avec un avertissement dans le rapport. À vérifier sur les 16 occurrences du dépôt avant de trancher.</p>` },
      { id: "P2-16", t: "Blocs de mise en page : epigraph, pull-quote, rubric, sidebar, topic, container, compound", e: "S", r: "f", u: "0 occurrence",
        d: `<p>Correspondance minimale : <code>blockquote</code> pour les citations, <code>aside class="sdoc-sidebar"</code> pour les encadrés latéraux, <code>div class="…"</code> pour <code>container</code>. Aucun usage dans le dépôt.</p>`,
        o: [ { k: "a", l: "Correspondance minimale par classes", rec: 1 }, { k: "b", l: "Avertissement et texte brut, sans HTML", x: "Moins de CSS à maintenir." } ] },
      { id: "P2-17", t: "Listes de champs, blocs de lignes, listes d'options", e: "S", r: "f", u: "non mesuré",
        d: `<p>Blocs de lignes (<code>| ligne</code>) : lignes séparées par deux espaces ou <code>&lt;br&gt;</code>. Listes de champs (<code>:Auteur: x</code>) : liste à puces « Auteur : x ». Listes d'options : liste à puces.</p>` },
      { id: "P2-18", t: "Directives de structure sans équivalent", e: "S", r: "f", u: "non mesuré",
        d: `<p><code>.. contents::</code>, <code>.. sectnum::</code>, <code>.. header::</code>, <code>.. footer::</code>, <code>.. include::</code>, <code>.. only::</code>, <code>.. toctree::</code> n'ont pas de sens dans un nœud : retirées avec avertissement. Dites si vous voulez une liste précise de ce que le rapport doit signaler en erreur plutôt qu'en avertissement.</p>` },
      { id: "P2-20", t: "Export Word des éléments HTML", e: "L", r: "m",
        d: `<p>L'export Word lit le Markdown puis traite surtout paragraphes, tableaux et images ; les alignements HTML sont déjà gérés. Il faut décider ce que devient un encadré dans Word : paragraphe encadré ou style « Note », liste de définitions, exposant et indice.</p>
        <p>C'est la tâche qui compte le plus pour un livrable contractuel Word.</p>`,
        f: ["strictdoc/backend/docx/export/markdown_to_paragraphs.py", "strictdoc/backend/docx/export/docx_template.py", "strictdoc/backend/docx/export/sdoc_to_docx_generator.py"],
        o: [ { k: "a", l: "Encadré = paragraphe avec style Word « Note » ou « Avertissement » du modèle", rec: 1 },
             { k: "b", l: "Encadré = tableau à une cellule colorée", x: "Visuel proche du HTML mais fragile pour les modifications suivies." } ] },
      { id: "P2-21", t: "Export PDF et impression", e: "S", r: "f",
        d: `<p>Styles <code>@media print</code> et règles d'éclatement de page pour les encadrés, vérifiés avec l'export html2pdf (Chrome).</p>`,
        f: ["strictdoc/features/html2pdf/templates/", "strictdoc/export/html/_static/"] },
      { id: "P2-22", t: "Éditeur Milkdown : insertion d'un encadré", e: "M", r: "m",
        d: `<p>Selon l'étude P2-00. Variante simple : entrée « Encadré » du menu d'insertion qui écrit le bloc HTML choisi. Variante riche : un nœud d'éditeur qui rend l'encadré en WYSIWYG et se sérialise vers ce HTML.</p>`,
        dep: ["P2-00"],
        o: [ { k: "a", l: "Insertion simple du bloc HTML", rec: 1 }, { k: "b", l: "Nœud WYSIWYG", x: "Chantier de plusieurs jours, avec reconstruction du bundle." }, { k: "c", l: "Pas d'aide à l'insertion", x: "On écrit le HTML à la main." } ] },
      { id: "P2-23", t: "Recherche, page d'un item, versions et assistant LLM", e: "S", r: "f",
        d: `<p>Vérifier que le texte des blocs HTML entre dans l'index de recherche, s'affiche sur la page d'un item et dans la comparaison de versions, et que l'assistant ne reçoit pas de balises en vrac (nettoyage dans <code>features/llm/context.py</code>).</p>`,
        f: ["strictdoc/backend/sdoc/models/document.py (build_search_index)", "strictdoc/features/item_page/", "strictdoc/features/llm/context.py"] }
    ] },

  { id: "p3", label: "3 · Convertisseur",
    title: "Phase 3 : convertisseur RST vers Markdown",
    intro: `<p>Un outil qui lit chaque <code>.sdoc</code> dont le balisage est RST (ou absent), convertit les champs multilignes, écrit <code>MARKUP: Markdown</code> et produit un rapport. Il s'appuie sur la phase 2 pour les constructions sans équivalent Markdown. L'analyse de docutils se fait sur le même arbre que le rendu actuel, donc avec les mêmes directives StrictDoc.</p>`,
    tasks: [
      { id: "P3-01", t: "Forme de l'outil", e: "S", r: "f",
        d: `<p>Une sous-commande de la famille <code>manage</code> : <code>strictdoc manage markup --to Markdown &lt;chemin&gt;</code>, avec <code>--dry-run</code>, <code>--report</code>, <code>--strict</code>, <code>--force</code>. Elle suit le modèle des commandes existantes (<code>manage_new_command.py</code> et son fichier de configuration).</p>`,
        f: ["strictdoc/commands/manage_markup_command.py (nouveau)", "strictdoc/commands/manage_markup_config.py (nouveau)", "strictdoc/cli/main.py"],
        o: [ { k: "a", l: "Commande manage dans le produit", rec: 1 }, { k: "b", l: "Script jetable dans developer/tools", x: "Moins d'effort, non couvert par les tests de la CLI." }, { k: "c", l: "Bouton web par document", x: "Demande des routes, des rôles et des tests end2end." } ] },
      { id: "P3-02", t: "Moteur de conversion", e: "L", r: "e",
        d: `<p>Parcourir l'arbre docutils (déjà utilisé pour le rendu) avec un visiteur qui écrit du Markdown. Les directives et rôles propres à StrictDoc sont enregistrés comme aujourd'hui (image avec joker, mathématiques, <code>rawhtml</code>).</p>`,
        f: ["strictdoc/backend/rst/rst_to_markdown.py (nouveau)"],
        o: [ { k: "a", l: "Visiteur docutils maison", rec: 1, x: "Fidèle à ce que StrictDoc affiche aujourd'hui, contrôle total du repli en HTML." },
             { k: "b", l: "Pandoc externe (-f rst -t gfm)", x: "Binaire à installer, ne connaît pas les directives StrictDoc, tableaux et encadrés imprévisibles." },
             { k: "c", l: "Expressions régulières", x: "Fragile : à écarter." } ] },
      { id: "P3-03", t: "Dépendance docutils pendant et après la migration", e: "S", r: "m",
        d: `<p>Le convertisseur a besoin de docutils, que la phase 4 retire de l'exécution. Il faut donc décider où docutils vit.</p>`,
        dep: ["P3-02"],
        o: [ { k: "a", l: "Groupe de dépendances optionnel « migration », retiré de l'exécution en phase 4", rec: 1, x: "Le convertisseur reste disponible, installé à la demande." },
             { k: "b", l: "Convertisseur supprimé avec docutils après la migration", x: "Plus simple, mais plus d'outil si un ancien projet réapparaît." } ] },
      { id: "P3-04", t: "Pipeline de lecture et d'écriture d'un document", e: "M", r: "m",
        d: `<p>Lire avec <code>SDReader</code>, convertir chaque champ multiligne (<code>STATEMENT</code>, <code>RATIONALE</code>, <code>COMMENT</code>, champs personnalisés multilignes, nœuds <code>TEXT</code>), mettre <code>MARKUP: Markdown</code>, réécrire avec <code>SDWriter</code>. Traiter aussi les fragments inclus par <code>DOCUMENT_FROM_FILE</code>. Objectif : un diff Git où seuls ces champs et la ligne <code>MARKUP</code> changent.</p>`,
        f: ["strictdoc/backend/sdoc/reader.py", "strictdoc/backend/sdoc/writer.py (wrap_rst_text)", "strictdoc/backend/sdoc/models/document_config.py"] },
      { id: "P3-05", t: "Règles : texte en ligne", e: "M", r: "m",
        d: `<ul><li>Emphase, gras, littéral (le double accent grave devient un seul, avec échappement si le texte contient un accent grave).</li>
        <li>Liens <code>texte &lt;url&gt;_</code>, liens anonymes, références nommées, substitutions <code>|nom|</code> résolues à la conversion.</li>
        <li>Échapper les caractères spéciaux Markdown (<code>* _ # &lt; | [ ]</code>) dans le texte normal.</li>
        <li><strong>Ne jamais échapper</strong> <code>[LINK: UID]</code> ni <code>[ANCHOR: id, "titre"]</code>.</li></ul>` },
      { id: "P3-06", t: "Règles : blocs", e: "M", r: "m",
        d: `<ul><li>Paragraphes, listes à puces et numérotées imbriquées, citations, blocs littéraux <code>::</code>.</li>
        <li><code>.. code::</code> et <code>.. code-block::</code> (249 occurrences) : clôtures avec langage.</li>
        <li><code>.. math::</code> (24) : <code>$$…$$</code>.</li>
        <li>Titres de section dans un champ : <code>#</code> ; transitions : <code>---</code> ; commentaires RST : commentaires HTML.</li>
        <li>Encadrés et rôles : selon les choix de la phase 2.</li></ul>` },
      { id: "P3-07", t: "Règles : tableaux", e: "L", r: "e", u: "23 list-table dans 9 fichiers",
        d: `<p>Les tableaux ne sont pas dans la phase 2, mais la conversion doit les traiter : <code>list-table</code>, tableaux en grille, tableaux simples.</p>
        <p>Format cible : tableau à barres verticales quand toutes les cellules tiennent sur une ligne, sans fusion ni bloc ; sinon tableau HTML (que l'éditeur sait relire quand toutes les balises et attributs sont connus). Gérer <code>:header-rows:</code>, <code>:widths:</code>, <code>:align:</code> et le titre (<code>caption</code>).</p>`,
        o: [ { k: "a", l: "Barres verticales si simple, HTML sinon", rec: 1 }, { k: "b", l: "Toujours en HTML", x: "Uniforme, plus lourd à lire dans le fichier." } ] },
      { id: "P3-08", t: "Règles : csv-table", e: "S", r: "f", u: "2 occurrences",
        d: `<p>Lire le CSV à la conversion (contenu en ligne ou fichier relatif aux ressources), appliquer <code>:header:</code>, <code>:delim:</code>, <code>:widths:</code>, puis écrire comme un tableau (tâche précédente). Le fichier CSV d'origine n'est plus nécessaire : le supprimer ou le garder.</p>`,
        o: [ { k: "a", l: "Garder le CSV dans les ressources", rec: 1 }, { k: "b", l: "Supprimer le CSV converti", x: "Nettoie, mais perd la source." } ] },
      { id: "P3-09", t: "Règles : images", e: "M", r: "m", u: "98 .. image::, 14 avec joker",
        d: `<p><code>.. image::</code> et <code>.. figure::</code> deviennent <code>![alt](chemin)</code>. Avec <code>:width:</code> ou <code>:align:</code>, écrire le HTML que l'éditeur sait relire (il gère l'alignement des images). Une légende de figure devient une ligne en italique ou <code>figcaption</code>.</p>
        <p>Les chemins avec joker (<code>schema.*</code>) n'existent pas en Markdown.</p>`,
        o: [ { k: "a", l: "Résoudre le joker vers l'extension réelle trouvée dans _assets (SVG, sinon PNG)", rec: 1 },
             { k: "b", l: "Conserver le joker tel quel", x: "L'image ne s'affichera plus en HTML." } ] },
      { id: "P3-10", t: "Commentaires de relecture", e: "S", r: "m",
        d: `<p>L'en-tête RST <code>.. sdoc-comment: …</code> devient <code>&lt;!-- sdoc-comment … --&gt;</code>. Les champs <code>anchor</code> et <code>anchor_n</code> désignent des mots du texte : vérifier qu'ils sont encore retrouvés après conversion, sinon avertir.</p>`,
        f: ["strictdoc/features/comments/model.py"] },
      { id: "P3-11", t: "Que faire d'une construction non convertible", e: "S", r: "m",
        d: `<p>Chaque construction qui ne se traduit pas fidèlement est signalée dans le rapport avec le document, le nœud, le champ et la ligne.</p>`,
        o: [ { k: "a", l: "Repli HTML sinon commentaire, avec avertissement ; --strict fait échouer", rec: 1 },
             { k: "b", l: "Toujours échouer", x: "Le document n'est pas écrit tant que tout n'est pas résolu." },
             { k: "c", l: "Laisser le texte RST tel quel avec une marque TODO", x: "Rendu faux visible en relecture." } ] },
      { id: "P3-12", t: "Rapport de conversion", e: "S", r: "f",
        d: `<p>Rapport Markdown et JSON : champs convertis ou inchangés, histogramme des constructions rencontrées, avertissements, échecs. <code>--dry-run</code> n'écrit rien.</p>` },
      { id: "P3-13", t: "Vérification sémantique automatique", e: "L", r: "e",
        d: `<p>Pour chaque champ : rendre l'ancien RST avec docutils, rendre le Markdown converti, normaliser les deux (texte, titres, listes, tableaux, liens, images) et comparer. Les écarts sont listés. Sert de test sur tout le corpus (<code>docs/</code> et tests).</p>`,
        dep: ["P3-02"] },
      { id: "P3-14", t: "Sécurité d'exécution", e: "S", r: "f",
        d: `<p>Ne convertit que les documents en RST ou sans balisage ; une seconde exécution ne change rien (idempotente) ; refuse un arbre Git non propre sauf <code>--force</code> ; un commit par document ou par projet.</p>` },
      { id: "P3-15", t: "Effets de la conversion sur les liens suspects, les PDF et les comparaisons", e: "M", r: "e",
        d: `<p>La conversion change le texte de <code>STATEMENT</code> : l'empreinte des liens suspects change, donc tous les liens deviennent suspects. Les barres de changement du PDF et l'écran de versions montrent tout comme modifié.</p>`,
        o: [ { k: "a", l: "Étiquette de version avant ; recalcul de la ligne de base juste après la conversion", rec: 1, x: "La conversion est vue comme un changement technique, pas une relecture à refaire." },
             { k: "b", l: "Empreinte calculée sur le texte rendu normalisé", x: "Évite le problème pour toutes les futures conversions, mais change un mécanisme existant." } ] },
      { id: "P3-16", t: "Tests du convertisseur", e: "L", r: "m",
        d: `<p>Tests unitaires par construction (cas d'or), tests d'intégration de la commande (<code>tests/integration/features/commands/manage/markup/</code>), exécution sur tout le corpus des <code>.sdoc</code> du dépôt avec la vérification sémantique.</p>` },
      { id: "P3-17", t: "Guide de migration", e: "S", r: "f",
        d: `<p>Page du guide utilisateur : table de correspondance RST vers Markdown, limites, comment lire le rapport, comment relancer.</p>` }
    ] },

  { id: "p4", label: "4 · Retrait du balisage",
    title: "Phase 4 : retirer le balisage RST du code (cas B)",
    intro: `<p>À ne lancer qu'après la migration des contenus. La liste suit le code actuel : chaque ligne cite un endroit où RST est en dur.</p>`,
    tasks: [
      { id: "P4-01", t: "Avertissement de dépréciation (étape 1)", e: "S", r: "f",
        d: `<p>Si C-06 retient deux étapes : à la lecture d'un document RST ou sans balisage, message via <code>DEPRECATION_ENGINE</code> qui renvoie vers la commande de conversion.</p>`,
        f: ["strictdoc/helpers/deprecation_engine.py", "strictdoc/core/traceability_index_builder.py"] },
      { id: "P4-02", t: "Grammaire : retirer RST de MARKUP", e: "S", r: "m",
        d: `<p>Enlever <code>'RST'</code> de <code>MarkupChoice</code> et <code>SDocMarkup.RST</code> ; un document avec <code>MARKUP: RST</code> donne une erreur explicite qui cite la commande de conversion.</p>`,
        f: ["strictdoc/backend/sdoc/grammar/grammar.py", "strictdoc/backend/sdoc/constants.py"] },
      { id: "P4-03", t: "Valeurs par défaut en dur", e: "M", r: "e",
        d: `<p>Remplacer le repli RST dans <code>DocumentConfig.get_markup()</code>, dans <code>MarkupRenderer</code> (3 endroits), dans <code>RequirementFormObject</code> (3 endroits) et dans <code>editable_field.js</code> (défaut 'RST', syntaxe d'insertion d'image).</p>`,
        f: ["strictdoc/backend/sdoc/models/document_config.py", "strictdoc/export/html/renderers/markup_renderer.py", "strictdoc/export/html/form_objects/requirement_form_object.py", "strictdoc/export/html/_static/editable_field.js"],
        dep: ["C-05"] },
      { id: "P4-04", t: "Rendus internes qui passent markup=\"RST\"", e: "S", r: "m",
        d: `<p>Ce sont des titres et noms générés par StrictDoc, pas du RST rédigé. À passer en Texte ou en Markdown selon le cas.</p>`,
        f: ["strictdoc/features/traceability_matrix/generator.py", "strictdoc/features/source_file_view/generator.py", "strictdoc/features/source_file_view/view_object.py", "strictdoc/features/nestor/view_object.py", "strictdoc/features/search/view_object.py"] },
      { id: "P4-05", t: "Supprimer le paquet backend/rst", e: "M", r: "m",
        d: `<p>Rendu HTML RST, directives (image avec joker, mathématiques, <code>rawhtml</code>), <code>formatter.py</code> et son utilisation dans <code>sdoc/writer.py</code>, <code>helpers/rst.py</code>, gabarit <code>rst/anchor.jinja</code>, branche RST de <code>MarkupRenderer</code>.</p>
        <p><strong>Attention :</strong> <code>strictdoc_lexer.py</code> colore la syntaxe <code>sdoc</code> dans les blocs de code. Le déplacer (par exemple dans <code>backend/sdoc/</code>) et l'enregistrer pour les clôtures <code>sdoc</code> en Markdown (trois apostrophes inverses suivies de sdoc), sinon la coloration disparaît.</p>`,
        f: ["strictdoc/backend/rst/", "strictdoc/helpers/rst.py", "strictdoc/export/html/templates/rst/anchor.jinja", "strictdoc/backend/sdoc/writer.py"] },
      { id: "P4-06", t: "Gestion des images", e: "S", r: "m",
        d: `<p><code>manage assets --clean-unused-images</code> lit les directives RST des images. Il ne doit plus lire que les images Markdown et HTML. Adapter aussi le commentaire de <code>core/image_formats.py</code>.</p>`,
        f: ["strictdoc/commands/manage_assets_command.py", "strictdoc/core/image_formats.py"] },
      { id: "P4-07", t: "Validation à l'enregistrement", e: "S", r: "m",
        d: `<p>Le serveur valide aujourd'hui la syntaxe RST avant d'enregistrer un nœud (<code>RstToHtmlFragmentWriter</code> dans <code>update_requirement.py</code> et <code>requirement_form_object.py</code>). À remplacer : Markdown n'a pas d'erreur de syntaxe fatale.</p>`,
        o: [ { k: "a", l: "Aucune validation de syntaxe", rec: 1 }, { k: "b", l: "Valider le HTML autorisé (liste blanche P2-01)", x: "Refuse l'enregistrement d'un HTML interdit." } ],
        f: ["strictdoc/core/transforms/update_requirement.py", "strictdoc/export/html/form_objects/requirement_form_object.py"] },
      { id: "P4-08", t: "Fonction MATHJAX", e: "S", r: "f",
        d: `<p>La fonction MATHJAX enregistre aujourd'hui des rôles et directives RST. En Markdown, <code>$…$</code> est déjà rendu. Simplifier le code et décider si le drapeau reste (l'amont a ouvert un chantier de dépréciation de MathJax et Mermaid).</p>`,
        o: [ { k: "a", l: "Garder le drapeau, retirer le code RST", rec: 1 }, { k: "b", l: "Supprimer le drapeau", x: "Rupture pour les configurations qui l'activent." } ] },
      { id: "P4-09", t: "Importeurs et exporteurs : balisage par défaut", e: "M", r: "m",
        d: `<p>Profil Word par défaut (<code>MARKUP_RST</code> devient Markdown), <code>docx_comments.py</code> (<code>markup = "RST"</code>), suppression de <code>rst_to_paragraphs.py</code> et de ses branches dans l'import et l'export, option <code>--reqif-import-markup</code> (la liste vient de <code>SDocMarkup.ALL</code>), valeur par défaut des importeurs Excel et ReqIF, <code>strictdoc new</code> et ses gabarits.</p>`,
        f: ["strictdoc/backend/docx/docx_profile.py", "strictdoc/backend/docx/export/docx_comments.py", "strictdoc/backend/docx/export/rst_to_paragraphs.py", "strictdoc/backend/docx/import_/docx_to_sdoc_converter.py", "strictdoc/commands/_shared.py", "strictdoc/commands/new_command.py"] },
      { id: "P4-10", t: "Cache et version", e: "S", r: "f",
        d: `<p>Supprimer le sous-dossier <code>&lt;cache&gt;/rst</code>. Les classes de modèle changent (constante supprimée) : la version du cache augmente pour invalider les fichiers pickle.</p>` },
      { id: "P4-11", t: "Dépendances et packaging", e: "S", r: "f",
        d: `<p>Retirer <code>docutils</code> de <code>pyproject.toml</code> à l'exécution (voir P3-03), régénérer <code>uv.lock</code>, supprimer <code>[mypy-docutils.*]</code> de <code>mypy.ini</code>, vérifier les hooks PyInstaller, <code>Dockerfile</code> et <code>flake.nix</code>.</p>`,
        f: ["pyproject.toml", "uv.lock", "mypy.ini", "developer/pyinstaller_hooks/", "Dockerfile", "flake.nix"] },
      { id: "P4-12", t: "Erreur ou avertissement final", e: "S", r: "f",
        d: `<p>Fin de l'étape 2 de C-06 : l'avertissement P4-01 devient l'erreur de P4-02 pour les documents sans balisage déclaré, selon le choix C-05.</p>`,
        dep: ["C-05", "C-06"] }
    ] },

  { id: "migration", label: "Migration des contenus",
    title: "Migration des contenus",
    intro: `<p>La conversion s'applique à trois ensembles : les données de production (déjà en Markdown pour REQ_02), la documentation de StrictDoc et les tests. L'ordre compte : aucune suppression de RST avant que tout soit migré.</p>`,
    tasks: [
      { id: "M-01", t: "Inventaire des projets réels (lecture seule)", e: "S", r: "f",
        d: `<p>Scanner <code>~/strictdoc-data</code>, <code>~/strictdoc-projects</code> et les dépôts GitLab de documents (<code>kb-isis</code>, projets créés par le portail) : nombre de <code>.sdoc</code> sans <code>MARKUP: Markdown</code>, directives RST, tableaux, images avec joker. Livrable : un rapport que vous validez avant toute conversion.</p>` },
      { id: "M-02", t: "Convertir la documentation de StrictDoc", e: "L", r: "m",
        d: `<p>15 documents dans <code>docs/</code>, tous en RST implicite : guide utilisateur (254 lignes de directives), notes de version, exigences L1 à L3, guide du développeur... Conversion par l'outil, relecture à la main, comparaison avant et après du site (<code>invoke docs</code>).</p>
        <p>Ces fichiers sont aussi modifiés par l'amont : conflits garantis en cas de fusion ultérieure.</p>`,
        dep: ["P3-13"],
        o: [ { k: "a", l: "Convertir sur place", rec: 1 }, { k: "b", l: "Garder une copie RST du guide hors du produit", x: "Garde la mémoire de l'ancien rendu." } ] },
      { id: "M-03", t: "Corpus de tests", e: "L", r: "e", u: "~1 770 .sdoc sans balisage, 94 avec directives",
        d: `<p>Ces fichiers sont des entrées de tests d'intégration et end2end ; la plupart contiennent du texte brut sans mise en forme.</p>`,
        o: [ { k: "a", l: "Ajouter MARKUP: Markdown aux fichiers sans mise en forme, convertir les 94 avec directives", rec: 1, x: "Évite de réécrire des centaines de résultats attendus qui ne dépendent pas du balisage." },
             { k: "b", l: "Tout convertir par l'outil, régénérer tous les résultats attendus", x: "Plus uniforme, très long à relire." },
             { k: "c", l: "Réécrire à la main les cas importants seulement", x: "Couverture inégale." } ] },
      { id: "M-04", t: "Tests propres à RST", e: "M", r: "f",
        d: `<p>Supprimer ou porter vers Markdown : <code>tests/integration/features/html/rst_markup_to_html/</code>, les tests unitaires de <code>tests/unit/strictdoc/export/rst/</code> (writer, lexeur, rôle <code>rawhtml</code>) et <code>test_rst_to_paragraphs.py</code>. Pour chaque test, un équivalent Markdown quand la fonction existe encore (code, mathématiques, images, tableaux).</p>` },
      { id: "M-05", t: "Données de production", e: "M", r: "m",
        d: `<p>REQ_02 est déjà en Markdown : vérifier seulement. Pour tout autre document RST trouvé en M-01 : étiquette de version avant, conversion, vérification de l'export Word avec le profil, recalcul de la ligne de base des liens suspects, reconstruction de l'index de la base de connaissances (<code>kb-isis</code>, hors dépôt) si le texte indexé change.</p>`,
        dep: ["M-01", "P3-15"] },
      { id: "M-06", t: "Ordre de bascule", e: "S", r: "f",
        d: `<p>Livrer P3 ; convertir <code>docs/</code> et les tests dans des commits séparés ; vérifier ; seulement alors lancer P4. Aucun commit de P4 ne doit entrer avant que le dépôt ne contienne plus aucun <code>MARKUP: RST</code>.</p>` }
    ] },

  { id: "fork", label: "Fonctions du fork",
    title: "Effets sur les fonctions du fork ISIS",
    intro: `<p>Points que vous n'aviez pas listés et que le retrait touche : éditeur, commentaires, Word, assistant, i18n, base de connaissances, documentation.</p>`,
    tasks: [
      { id: "F-01", t: "Contrat de format entre convertisseur et éditeur Milkdown", e: "M", r: "e",
        d: `<p>Le convertisseur écrit du Markdown, des tableaux HTML et des blocs HTML ; l'éditeur doit les relire sans les altérer, et écrire le même format quand un auteur modifie le champ. Un test automatique charge un document converti dans l'éditeur, enregistre sans modification, et compare le texte.</p>`,
        dep: ["P2-00"], f: ["developer/milkdown/src/tables.js", "developer/milkdown/src/sdoc_markers.js", "developer/milkdown/playwright/"] },
      { id: "F-02", t: "Commentaires de relecture", e: "S", r: "f",
        d: `<p>Retirer la variante RST de l'en-tête de commentaire (<code>_RST_HEADER</code>) quand la migration est finie ; garder la lecture tolérante pendant la dépréciation.</p>`,
        f: ["strictdoc/features/comments/model.py", "strictdoc/features/comments/assets/comments/comments.js"] },
      { id: "F-03", t: "Word : import, export et mise à jour", e: "M", r: "m",
        d: `<p>Le profil Word passe en Markdown par défaut. Vérifier la mise à jour d'un Word existant avec modifications suivies (<code>docx_tracked_update.py</code>) : elle compare du texte ; après conversion, les textes diffèrent sans que le fond change. Prévoir un cas de test avec REQ_02.</p>`,
        f: ["strictdoc/backend/docx/export/docx_tracked_update.py", "strictdoc/backend/docx/docx_profile.py"] },
      { id: "F-04", t: "Assistant LLM", e: "S", r: "f",
        d: `<p>Les prompts ne parlent pas de RST (recherche faite dans le code Python ; les 23 fichiers de prompts restent à relire). L'assistant écrit dans le balisage du document : vérifier <code>create_text_node</code>, <code>/glossary</code>, <code>/translate</code> sur un document Markdown, et les cas du jeu d'évaluation.</p>`,
        f: ["strictdoc/features/llm/service.py", "strictdoc/features/llm/prompts/", "strictdoc/features/llm/golden/"] },
      { id: "F-05", t: "Interface en français", e: "S", r: "f",
        d: `<p>Nouveaux textes (rapport du convertisseur, messages de dépréciation, aides d'insertion d'encadré) ajoutés au catalogue français ; textes devenus inutiles retirés. Mise à jour par <code>developer/i18n/update_catalogs.py</code>.</p>` },
      { id: "F-06", t: "Rôles et routes", e: "S", r: "f",
        d: `<p>La commande est en ligne de commande : aucune route. Si le bouton web de P3-01 est retenu, chaque nouvelle route doit figurer dans <code>ROUTE_ROLES</code> (rôle administrateur) sinon le serveur ne démarre pas.</p>`,
        f: ["strictdoc/features/roles/route_roles.py"] },
      { id: "F-07", t: "Base de connaissances (kb-platform)", e: "S", r: "m",
        d: `<p>L'indexeur de la base de connaissances lit des <code>.sdoc</code> ; je ne peux pas voir s'il suppose du RST (dépôt hors de celui-ci). À vérifier avant de convertir des documents de mission.</p>` },
      { id: "F-08", t: "Écrans qui rendent des champs", e: "S", r: "f",
        d: `<p>Page d'un item, vue en pages, comparaison de versions, page des liens suspects et des commentaires : tous passent par <code>MarkupRenderer</code>. Test de bout en bout après P4.</p>` },
      { id: "F-09", t: "Documentation d'architecture", e: "S", r: "f",
        d: `<p>Mettre à jour <code>architecture/</code> (documents 02, 03, 04, 06, 08, 11, 12 et l'index) : retirer RST, ajouter le convertisseur et les éléments HTML.</p>`,
        f: ["architecture/"] },
      { id: "F-10", t: "CLAUDE.md et AGENTS.md", e: "S", r: "f",
        d: `<p>CLAUDE.md décrit les lectures « .sdoc, Markdown, RST, ReqIF » : retirer RST. Rien à changer dans AGENTS.md à part vérifier la mention des formats.</p>`,
        f: ["CLAUDE.md", "AGENTS.md"] }
    ] },

  { id: "qualite", label: "Tests, docs, CI",
    title: "Tests, documentation, packaging et CI",
    intro: `<p>Mesures transversales qui valident chaque phase.</p>`,
    tasks: [
      { id: "Q-01", t: "Stratégie de test par phase", e: "M", r: "f",
        d: `<p>P1 : tests d'intégration de la CLI. P2 : tests de rendu des éléments HTML, tests Milkdown, tests d'export Word et PDF. P3 : corpus et vérification sémantique. P4 : suite complète (<code>invoke check</code>, puis end2end avec <code>--headless</code>).</p>` },
      { id: "Q-02", t: "Référence de rendu avant et après", e: "S", r: "f",
        d: `<p>Exporter REQ_02 et <code>docs/</code> en HTML avant la phase 1 ; comparer le texte visible après chaque phase. C'est le test le plus parlant pour vous.</p>`,
        o: [ { k: "a", l: "Comparaison automatique du texte visible", rec: 1 }, { k: "b", l: "Relecture visuelle par captures d'écran", x: "Meilleure pour les encadrés, plus lente." } ] },
      { id: "Q-03", t: "Exigences et traçabilité", e: "M", r: "m",
        d: `<p>Nouvelles exigences (convertisseur, éléments HTML, retrait de RST), marqueurs <code>@relation</code>, retrait des exigences RST. Les numéros SDOC-SRS-208 à 216 du fork entrent en collision avec ceux de l'amont : à renuméroter avant toute fusion de l'amont.</p>`,
        f: ["docs/strictdoc_21_l2_high_level_requirements.sdoc", "docs/strictdoc_22_l3_low_level_requirements.sdoc"] },
      { id: "Q-04", t: "Guide utilisateur et FAQ", e: "M", r: "f",
        d: `<p>Section « Markdown » complétée (HTML autorisé, éléments de remplacement), section « Migrer de RST », retrait des sections RST (directives, rôles, Sphinx).</p>` },
      { id: "Q-05", t: "Notes de version et ruptures", e: "S", r: "f",
        d: `<p>Ruptures à lister : <code>MARKUP: RST</code>, <code>--formats=rst</code>, balisage par défaut, <code>--reqif-import-markup RST</code>, profil Word par défaut, API Python (vérifier si <code>strictdoc.api</code> exporte des classes RST).</p>`,
        f: ["docs/strictdoc_04_release_notes.sdoc", "strictdoc/api/__init__.py"] },
      { id: "Q-06", t: "CI, packaging et durée", e: "S", r: "f",
        d: `<p>Options de données PyInstaller et Nuitka, <code>Dockerfile</code>, environnement de test Docker (arm64 inclus), durée de la suite. Le retrait doit raccourcir la suite : plus de tests RST, un cache en moins.</p>`,
        f: ["tasks.py", "Dockerfile", "developer/docker_tests/"] },
      { id: "Q-07", t: "Mesure de performance", e: "S", r: "f",
        d: `<p>Temps d'export de <code>docs/</code> et d'un gros document, avant et après (docutils et son cache disparaissent). Critère : aucune régression.</p>` }
    ] },

  { id: "risques", label: "Risques et livraison",
    title: "Risques, livraison et ce qui reste hors périmètre",
    intro: `<p>Chaque risque a une parade et un propriétaire. Dites si l'une d'elles vous paraît insuffisante.</p>`,
    tasks: [
      { id: "R-01", t: "Contenu RST lu comme du Markdown, sans erreur", e: "M", r: "e",
        d: `<p>Le plus grave : un ancien document sans <code>MARKUP</code> s'afficherait faux. Parades : migration complète avant P4 (M-06), erreur sur <code>MARKUP: RST</code> (P4-02), avertissement sur tout champ qui contient une directive ou un double accent grave.</p>` },
      { id: "R-02", t: "Dérive de rendu", e: "M", r: "m",
        d: `<p>Parade : vérification sémantique automatique (P3-13) et comparaison avant et après (Q-02).</p>` },
      { id: "R-03", t: "Conflits avec l'amont", e: "M", r: "m",
        d: `<p>Parade : cherry-pick des correctifs utiles avant P4 ; liste des fichiers supprimés pour les fusions futures ; renumérotation des exigences (Q-03).</p>`,

(function applyRevision() {
  const find = (id) => { for (const tab of TABS) { const t = tab.tasks.find((x) => x.id === id); if (t) return t; } return null; };
  Object.entries(REVISIONS).forEach(([id, patch]) => {
    const task = find(id);
    if (!task) throw new Error("revision: " + id);
    task.oldO = task.o;
    Object.assign(task, patch);
  });
  Object.entries(DECISIONS_TAKEN).forEach(([id, text]) => { const task = find(id); if (task) task.dec = text; });
  ADDED.forEach((add) => {
    const tab = TABS.find((x) => x.tasks.some((t) => t.id === add.after));
    const index = tab.tasks.findIndex((t) => t.id === add.after);
    tab.tasks.splice(index + 1, 0, add.task);
  });
  NEW_TABS.forEach((tab) => TABS.push(tab));
  TABS[0].intro = CHANGES_HTML + TABS[0].intro;
})();

function seedIfEmpty() {
  if (Object.keys(answers).length > 0) return;
  SEED_ANSWERS.forEach((seed) => {
    const task = TASK_BY_ID[seed.id];
    if (!task || !seed.d) return;
    const options = task.oldO || task.o || [];
    const hit = seed.vl ? options.find((opt) => opt.l.replace(/<[^>]+>/g, "") === seed.vl) : null;
    answers[seed.id] = { d: seed.d, o: hit ? hit.k : "", c: seed.c || "", v: 1 };
  });
  localSave();
}
const EFFORT_LABEL = { S: "Effort S ≈ ½ j", M: "Effort M ≈ 1 à 2 j", L: "Effort L ≈ 3 à 5 j" };
const RISK_LABEL = { f: "Risque faible", m: "Risque moyen", e: "Risque élevé" };
const DEC_LABEL = { ok: "Validée", talk: "À discuter", ko: "Invalidée", stale: "À revoir" };

function esc(text) {
  return String(text).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}
function answerOf(id) { return answers[id] || { d: "", o: "", c: "" }; }
function setStatus(state, text) {
  const node = document.getElementById("savestate");
  node.dataset.s = state;
  node.textContent = text;
}

/* ----------------------------- rendering ---------------------------- */
function cardHTML(task) {
  const meta = [
    `<span class="meta">${EFFORT_LABEL[task.e]}</span>`,
    `<span class="meta meta--risk-${task.r}">${RISK_LABEL[task.r]}</span>`
  ];
  if (task.u) meta.push(`<span class="meta">Usage : ${esc(task.u)}</span>`);
  (task.dep || []).forEach((dep) => meta.push(`<span class="meta">Dépend de <a href="#" data-goto="${dep}">${dep}</a></span>`));
  const files = task.f && task.f.length
    ? `<details class="card__files"><summary>Fichiers concernés (${task.f.length})</summary><ul>${task.f.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>`
    : "";
  const options = task.o && task.o.length
    ? `<fieldset class="options"><legend>Variante (sans choix : la recommandée)</legend>${task.o.map((opt) => `
        <label class="opt"><input type="radio" name="o-${task.id}" value="${opt.k}">
          <span class="opt__label">${opt.l}${opt.rec ? '<span class="rec">Recommandé</span>' : ""}</span>
          ${opt.x ? `<span class="opt__x">${opt.x}</span>` : ""}
        </label>`).join("")}</fieldset>`
    : "";
  return `<article class="card" id="task-${task.id}" data-id="${task.id}" data-state="">
    <header class="card__head">
      <span class="card__id">${task.id}</span>
      <h3 class="card__title">${task.t}</h3>
      ${task.n ? '<span class="pill pill--new">Nouvelle</span>' : (task.v > 1 ? '<span class="pill pill--mod">Modifiée</span>' : "")}
      <span class="pill pill--state" data-role="state">Sans décision</span>
    </header>
    <div class="card__meta">${meta.join("")}</div>
    <div class="stale-note" data-role="stale" hidden></div>
    ${task.ch ? `<div class="dec"><span class="dec__label">Ce qui a changé</span>${task.ch}</div>` : ""}
    ${task.dec ? `<div class="dec"><span class="dec__label">Pris en compte</span>${task.dec}</div>` : ""}
    <div class="card__body">${task.d}</div>
    ${files}
    ${options}
    <div class="decide">
      <fieldset class="seg" aria-label="Décision pour ${task.id}">
        ${["ok", "talk", "ko"].map((k) => `<label><input type="radio" name="d-${task.id}" value="${k}"><span>${k === "ok" ? "Valider" : k === "talk" ? "À discuter" : "Invalider"}</span></label>`).join("")}
      </fieldset>
      <button type="button" class="clear" data-clear="${task.id}" hidden>Effacer</button>
    </div>
    <label class="comment"><span>Commentaire</span><textarea id="c-${task.id}" rows="2" placeholder="Votre remarque, une condition, une alternative…"></textarea></label>
  </article>`;
}
